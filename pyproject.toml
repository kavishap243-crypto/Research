[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-filter-tool"
version = "0.2.0"
description = "Portfolio research and interactive live dashboard for Indian/global/geopolitical and sector news."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.30.0",
  "streamlit-autorefresh>=1.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
